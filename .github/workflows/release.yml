# Builds Dreame Control for Windows, macOS, Linux and Android and publishes a GitHub release, only
# when a version tag is pushed:
#   git tag v0.2.0
#   git push origin v0.2.0
# Nothing runs on ordinary pushes. The release takes the tag's name; the packages take its number.
#
# The Android APK is signed with the release key from these repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
#   ANDROID_KEY_PASSWORD       the key's password; may be left unset when it is the same
# Without the keystore secret the Android job fails rather than publish a debug-signed APK.
#
# The macOS app is signed with a Developer ID certificate and notarized by Apple, with these
# repository secrets:
#   MACOS_CERTIFICATE_P12       the "Developer ID Application" certificate and its private key,
#                               exported from Keychain Access as .p12 and base64-encoded
#   MACOS_CERTIFICATE_PASSWORD  the password of the .p12 file
#   NOTARY_API_KEY              an App Store Connect API key: the contents of its .p8 file
#   NOTARY_API_KEY_ID           that key's ID
#   NOTARY_API_ISSUER           that key's issuer ID
# Without them the macOS job fails rather than publish an app that is not notarized.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
            targets: aarch64-apple-darwin
          - name: linux
            # The oldest supported Ubuntu, so the program runs on older systems too.
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Version from the tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Linux build libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libgl1-mesa-dev libdbus-1-dev pkg-config

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./apps/dreame-desktop/packaging/windows/package.ps1 $env:VERSION

      # A keychain made for this job holds the certificate. Its password protects a file that is
      # deleted when the job ends, so a random one serves. The partition list lets codesign use the
      # key without a dialog. The API key is written to a file, because notarytool reads it from one.
      - name: Signing keychain and notary key (macOS)
        if: matrix.name == 'macos'
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          for v in CERTIFICATE_P12 CERTIFICATE_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER; do
            if [ -z "${!v}" ]; then
              echo "::error::The macOS signing secrets MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, NOTARY_API_KEY, NOTARY_API_KEY_ID and NOTARY_API_ISSUER are not all set."
              exit 1
            fi
          done
          umask 077
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"
          printf '%s' "$CERTIFICATE_P12" | base64 -d > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          # Each keychain already on the search list becomes one argument.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error::MACOS_CERTIFICATE_P12 holds no Developer ID Application certificate with its private key."
            exit 1
          fi
          printf '%s\n' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary.p8"
          {
            echo "DREAME_SIGN_IDENTITY=$identity"
            echo "DREAME_NOTARY_KEY=$RUNNER_TEMP/notary.p8"
            echo "DREAME_NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "DREAME_NOTARY_ISSUER=$NOTARY_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: bash apps/dreame-desktop/packaging/macos/package.sh "$VERSION"

      - name: Remove the signing keychain (macOS)
        if: always() && matrix.name == 'macos'
        run: |
          rm -f "$RUNNER_TEMP/signing.p12" "$RUNNER_TEMP/notary.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: bash apps/dreame-desktop/packaging/linux/package.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: dreame-control-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Build (android)
    runs-on: ubuntu-latest
    env:
      # The NDK the local builds use (task android:libs).
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Version from the tag
        # versionCode must grow with each release: 1.2.3 becomes 10203.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${VERSION%%-*}"
          {
            echo "VERSION=$VERSION"
            echo "DREAME_VERSION_NAME=$VERSION"
            echo "DREAME_VERSION_CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))"
          } >> "$GITHUB_ENV"

      - name: Signing key
        # A release must be signed with the release key, so a missing secret stops the job
        # rather than shipping a debug-signed APK. The key file lives only on the runner.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DREAME_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Rust library and Kotlin bindings
        run: |
          cargo ndk -t arm64-v8a -t x86_64 -P 26 -o apps/dreame-android/app/src/main/jniLibs build -p dreame-ffi --lib --release
          cargo build -q -p dreame-ffi --lib
          cargo run -q -p dreame-ffi --features bindgen --bin uniffi-bindgen -- generate \
            --library target/debug/libdreame_ffi.so --language kotlin --no-format \
            --out-dir apps/dreame-android/app/src/main/java

      - name: Release APK
        working-directory: apps/dreame-android
        env:
          DREAME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          DREAME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          DREAME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon assembleRelease
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/dist/dreame-control-$VERSION.apk"

      - name: Check the signature
        # Fails when the APK is signed with the debug key.
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "dist/dreame-control-$VERSION.apk" | tee signer.txt
          ! grep -q "CN=Android Debug" signer.txt

      - uses: actions/upload-artifact@v4
        with:
          name: dreame-control-android
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dreame Control $GITHUB_REF_NAME" \
            --generate-notes
