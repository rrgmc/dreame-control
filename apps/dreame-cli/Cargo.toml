[package]
name = "dreame-cli"
description = "Command-line tool for Dreame robot vacuums."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "dreame"
path = "src/main.rs"

[dependencies]
dreame-core.workspace = true
dreame-cloud.workspace = true
dreame-map.workspace = true
dreame-mqtt.workspace = true
dreame-model.workspace = true
dreame.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }
clap = { version = "4", features = ["derive"] }
