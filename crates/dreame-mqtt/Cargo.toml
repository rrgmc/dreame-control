[package]
name = "dreame-mqtt"
description = "Dreamehome cloud MQTT push client: pinned TLS, reconnects, typed push messages."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dreame-core.workspace = true
dreame-cloud.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
tracing.workspace = true
rand.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
futures-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
